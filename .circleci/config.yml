version: 2.1

# Spring PetClinic — Java 17 (pom.xml / build.gradle set java.version = 17).
# One project, built two ways like the existing GitHub Actions workflows
# (maven-build.yml and gradle-build.yml). Maven is the primary build and
# runs tests through CircleCI Smarter Testing; the Gradle job mirrors
# `./gradlew build` from the existing CI.

jobs:
  maven-build-test:
    docker:
      - image: cimg/openjdk:17.0
    resource_class: medium+
    environment:
      MAVEN_OPTS: -Xmx1536m
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-
      - run:
          name: Install dependencies
          command: ./mvnw -B -q dependency:go-offline -DskipTests
      - save_cache:
          key: maven-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2/repository
      - run:
          name: Build
          command: ./mvnw -B -DskipTests package
      - run:
          name: Test (Smarter Testing)
          command: circleci testsuite run "maven-unit-tests"
      - run:
          name: Lint (spring-javaformat + nohttp checkstyle)
          command: ./mvnw -B spring-javaformat:validate checkstyle:check@nohttp-checkstyle-validation
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: target/surefire-reports
          destination: surefire-reports

  gradle-build:
    docker:
      - image: cimg/openjdk:17.0
    resource_class: medium+
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx1536m
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-v1-
      - run:
          name: Install dependencies
          command: ./gradlew dependencies --quiet
      - save_cache:
          key: gradle-v1-{{ checksum "build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Build, test and lint (same as existing CI)
          command: ./gradlew build
      - store_test_results:
          path: build/test-results/test

workflows:
  build-and-test:
    jobs:
      - maven-build-test
      - gradle-build
  deploy:
    jobs:
      - gradle-build
